[package]
name = "simple-mcp-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "io-std",
    "signal",
] }
rmcp = { version = "1.7.0", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }
anyhow = "1.0"

[dev-dependencies]
anyhow = "1.0"
pretty_assertions = "1.4.1"
rmcp = { version = "1.7.0", features = ["client", "transport-child-process"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

